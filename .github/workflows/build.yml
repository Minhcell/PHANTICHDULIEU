name: Build PhanTichCuocGoi (exe + apk)

# Workflow tự tạo lại toàn bộ mã nguồn PC và Android,
# trên GitHub chỉ cần có file này và thư mục web (index.html, xlsx.full.min.js).

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Kiểm tra thư mục web
        shell: bash
        run: |
          for f in web/index.html web/xlsx.full.min.js; do
            if [ ! -f "$f" ]; then echo "::error::Thiếu file $f trên GitHub. Hãy upload lại file này."; missing=1; fi
          done
          [ -z "$missing" ]
      - name: Tạo mã nguồn PC
        shell: bash
        run: |
          mkdir -p "pc"
          cat > "pc/package.json" <<'EOF_0'
          {
            "name": "phantichcuocgoi",
            "productName": "PhanTichCuocGoi",
            "version": "1.0.0",
            "description": "Phân tích Cuộc gọi / SMS (offline, mạng LAN)",
            "main": "main.js",
            "author": "Hi",
            "license": "UNLICENSED",
            "scripts": {
              "start": "electron .",
              "dist": "electron-builder --win portable --x64 --publish never"
            },
            "devDependencies": {
              "electron": "31.7.7",
              "electron-builder": "24.13.3"
            },
            "build": {
              "appId": "vn.phantichcg.pc",
              "productName": "PhanTichCuocGoi",
              "files": ["main.js", "preload.js", "web/**/*"],
              "directories": { "output": "dist" },
              "win": { "target": [{ "target": "portable", "arch": ["x64"] }] },
              "portable": { "artifactName": "PhanTichCuocGoi.exe", "unpackDirName": "PhanTichCuocGoi" }
            }
          }
          EOF_0
          mkdir -p "pc"
          cat > "pc/main.js" <<'EOF_1'
          // Phân tích Cuộc gọi / SMS - bản PC (Electron, chạy offline, có thể làm máy chủ mạng LAN)
          const { app, BrowserWindow, ipcMain, dialog, shell, Menu } = require("electron");
          const path = require("path");
          const fs = require("fs");
          const http = require("http");
          const os = require("os");

          const DATA_DIR_NAME = "PhanTich_DuLieu";
          const KHO_FILE = "kho.json";          // tài khoản người dùng, mật khẩu admin
          const LAN_FILE = "lan.json";
          const CONFIG_NAME = "PhanTichCuocGoi.config.json";
          const WEB_DIR = path.join(__dirname, "web");
          const SUBS = ["TepDaPhanTich/mobi", "TepDaPhanTich/vina", "TepDaPhanTich/viettel", "KetQua"];

          const exeDir = process.env.PORTABLE_EXECUTABLE_DIR || path.dirname(app.getPath("exe"));
          let dataDir = null;
          let kho = {};                // { pa_users:[...], pa_adm_pass:"..." }
          let ver = Date.now();
          let lan = { enabled: false, port: 6868, pass: "" };
          let server = null, serverError = "";

          function isDir(p) { try { return fs.statSync(p).isDirectory(); } catch { return false; } }
          function readJson(p) { try { return JSON.parse(fs.readFileSync(p, "utf8")); } catch { return null; } }
          function safeName(n) { return String(n || "").replace(/[\\/:*?"<>|]/g, "_").replace(/^\.+/, "").slice(0, 180) || "file"; }
          function safeSub(s) { if (!SUBS.includes(s)) throw new Error("Thư mục không hợp lệ"); return s; }

          function findDataDir() {
            const besideExe = path.join(exeDir, DATA_DIR_NAME);
            if (isDir(besideExe)) return besideExe;
            if (fs.existsSync(path.join(exeDir, KHO_FILE))) return exeDir;
            for (const cfgPath of [path.join(exeDir, CONFIG_NAME), path.join(app.getPath("userData"), CONFIG_NAME)]) {
              const cfg = readJson(cfgPath);
              if (cfg && cfg.dataDir && isDir(cfg.dataDir)) return cfg.dataDir;
            }
            return null;
          }
          function resolveChosen(folder) {
            if (path.basename(folder) === DATA_DIR_NAME || fs.existsSync(path.join(folder, KHO_FILE))) return folder;
            return path.join(folder, DATA_DIR_NAME);
          }
          function writeAtomic(file, data) {
            const tmp = file + ".tmp";
            fs.writeFileSync(tmp, data);
            if (fs.existsSync(file)) { try { fs.copyFileSync(file, file + ".bak"); } catch {} }
            fs.renameSync(tmp, file);
          }

          /* ---------- dữ liệu dùng chung ---------- */
          function loadKho() {
            kho = (dataDir && (readJson(path.join(dataDir, KHO_FILE)) || readJson(path.join(dataDir, KHO_FILE + ".bak")))) || {};
            ver = Date.now();
          }
          function kvSet(key, value) {
            if (!["pa_users", "pa_adm_pass"].includes(key)) throw new Error("Khoá không hợp lệ");
            if (!dataDir) throw new Error("Chưa chọn thư mục dữ liệu");
            if (value === null || value === undefined) delete kho[key]; else kho[key] = value;
            writeAtomic(path.join(dataDir, KHO_FILE), JSON.stringify(kho, null, 1));
            ver = Math.max(Date.now(), ver + 1);
            return { ver };
          }
          function saveFile(sub, name, buf) {
            if (!dataDir) throw new Error("Chưa chọn thư mục dữ liệu");
            const dir = path.join(dataDir, safeSub(sub));
            fs.mkdirSync(dir, { recursive: true });
            const p = path.join(dir, safeName(name));
            fs.writeFileSync(p, buf);
            ver = Math.max(Date.now(), ver + 1);
            return p;
          }
          function listFiles(sub) {
            if (!dataDir) return [];
            const dir = path.join(dataDir, safeSub(sub));
            if (!isDir(dir)) return [];
            return fs.readdirSync(dir).filter(n => !n.startsWith(".")).map(n => {
              const st = fs.statSync(path.join(dir, n));
              return st.isFile() ? { name: n, size: st.size, time: st.mtimeMs } : null;
            }).filter(Boolean).sort((a, b) => b.time - a.time);
          }
          function filePath(sub, name) {
            if (!dataDir) throw new Error("Chưa chọn thư mục dữ liệu");
            const p = path.join(dataDir, safeSub(sub), safeName(name));
            if (!fs.existsSync(p)) throw new Error("Không tìm thấy file " + name);
            return p;
          }

          /* ---------- máy chủ mạng LAN ---------- */
          function lanAddresses() {
            const out = [];
            for (const list of Object.values(os.networkInterfaces())) for (const a of list || []) if (a.family === "IPv4" && !a.internal) out.push(a.address);
            return out;
          }
          function lanStatus() { return { enabled: !!lan.enabled, port: lan.port, pass: lan.pass, running: !!server, addresses: lanAddresses(), error: serverError }; }
          function loadLan() {
            const j = dataDir ? readJson(path.join(dataDir, LAN_FILE)) : null;
            lan = { enabled: !!(j && j.enabled), port: (j && +j.port) || 6868, pass: (j && j.pass) || "" };
          }
          function saveLan() { if (dataDir) fs.writeFileSync(path.join(dataDir, LAN_FILE), JSON.stringify(lan, null, 2)); }

          const MIME = { ".html": "text/html; charset=utf-8", ".js": "text/javascript; charset=utf-8", ".css": "text/css", ".json": "application/json", ".png": "image/png", ".svg": "image/svg+xml" };
          function send(res, code, obj) { res.writeHead(code, { "Content-Type": "application/json; charset=utf-8", "Cache-Control": "no-store" }); res.end(JSON.stringify(obj)); }
          function readBody(req, limit) {
            return new Promise((resolve, reject) => {
              const chunks = []; let size = 0;
              req.on("data", c => { size += c.length; if (size > limit) { reject(new Error("Dữ liệu gửi lên quá lớn")); req.destroy(); } else chunks.push(c); });
              req.on("end", () => resolve(Buffer.concat(chunks)));
              req.on("error", reject);
            });
          }

          async function handle(req, res) {
            res.setHeader("Access-Control-Allow-Origin", "*");
            res.setHeader("Access-Control-Allow-Headers", "Content-Type, X-Pass");
            res.setHeader("Access-Control-Allow-Methods", "GET, POST, OPTIONS");
            if (req.method === "OPTIONS") { res.writeHead(204); return res.end(); }
            const url = new URL(req.url, "http://x");
            const p = decodeURIComponent(url.pathname);

            if (p.startsWith("/api/")) {
              if (p === "/api/info") return send(res, 200, { app: "PhanTichCuocGoi", needPass: !!lan.pass, name: os.hostname() });
              let pass = ""; try { pass = decodeURIComponent(req.headers["x-pass"] || ""); } catch {}
              if (lan.pass && pass !== lan.pass) return send(res, 401, { error: "Sai mật khẩu" });
              try {
                const q = k => url.searchParams.get(k) || "";
                if (req.method === "GET" && p === "/api/ver") return send(res, 200, { ver });
                if (req.method === "GET" && p === "/api/kv") return send(res, 200, { ver, data: kho });
                if (req.method === "POST" && p === "/api/kv") { const b = JSON.parse((await readBody(req, 5e6)).toString("utf8") || "{}"); return send(res, 200, kvSet(b.key, b.value)); }
                if (req.method === "GET" && p === "/api/files") return send(res, 200, { files: listFiles(q("sub")) });
                if (req.method === "GET" && p === "/api/file") {
                  const fp = filePath(q("sub"), q("name"));
                  res.writeHead(200, { "Content-Type": "application/octet-stream", "Cache-Control": "no-store" });
                  return fs.createReadStream(fp).pipe(res);
                }
                if (req.method === "POST" && p === "/api/file") {
                  const buf = await readBody(req, 500 * 1024 * 1024);
                  return send(res, 200, { path: saveFile(q("sub"), q("name"), buf) });
                }
                return send(res, 404, { error: "Không có chức năng này" });
              } catch (e) { return send(res, 500, { error: e.message }); }
            }

            if (req.method !== "GET") { res.writeHead(405); return res.end(); }
            const file = p === "/" ? "index.html" : p.replace(/^\/+/, "");
            const full = path.normalize(path.join(WEB_DIR, file));
            if (!full.startsWith(WEB_DIR) || !fs.existsSync(full) || !fs.statSync(full).isFile()) { res.writeHead(404); return res.end("Not found"); }
            res.writeHead(200, { "Content-Type": MIME[path.extname(full).toLowerCase()] || "application/octet-stream" });
            fs.createReadStream(full).pipe(res);
          }

          function stopServer() { return new Promise(r => { if (!server) return r(); const s = server; server = null; s.close(() => r()); setTimeout(r, 1000); }); }
          function startServer() {
            return new Promise(resolve => {
              serverError = "";
              const s = http.createServer((req, res) => { handle(req, res).catch(e => { try { send(res, 500, { error: e.message }); } catch {} }); });
              s.on("error", e => { serverError = e.code === "EADDRINUSE" ? `Cổng ${lan.port} đang bị chương trình khác dùng, hãy chọn cổng khác.` : "Không bật được chia sẻ: " + e.message; server = null; resolve(); });
              s.listen(lan.port, "0.0.0.0", () => { server = s; resolve(); });
            });
          }
          async function applyLan() { await stopServer(); if (lan.enabled && dataDir) await startServer(); return lanStatus(); }

          /* ---------- cầu nối với giao diện ---------- */
          ipcMain.handle("store:status", () => ({ platform: "pc", configured: !!dataDir, folder: dataDir, suggest: path.join(exeDir, DATA_DIR_NAME) }));
          ipcMain.handle("store:choose", async (e) => {
            const r = await dialog.showOpenDialog(BrowserWindow.fromWebContents(e.sender), { title: "Chọn nơi lưu dữ liệu", defaultPath: exeDir, properties: ["openDirectory", "createDirectory"] });
            if (r.canceled || !r.filePaths[0]) return null;
            const folder = resolveChosen(r.filePaths[0]);
            return { folder, hasData: fs.existsSync(path.join(folder, KHO_FILE)) };
          });
          ipcMain.handle("store:confirm", async (e, folder) => {
            try {
              const dir = resolveChosen(folder || path.join(exeDir, DATA_DIR_NAME));
              fs.mkdirSync(dir, { recursive: true });
              for (const sub of SUBS) fs.mkdirSync(path.join(dir, sub), { recursive: true });
              if (!fs.existsSync(path.join(dir, KHO_FILE))) writeAtomic(path.join(dir, KHO_FILE), "{}");
              const cfg = JSON.stringify({ dataDir: dir }, null, 2);
              try { fs.writeFileSync(path.join(exeDir, CONFIG_NAME), cfg); } catch {}
              try { fs.mkdirSync(app.getPath("userData"), { recursive: true }); fs.writeFileSync(path.join(app.getPath("userData"), CONFIG_NAME), cfg); } catch {}
              dataDir = dir; loadKho(); loadLan(); await applyLan();
              return { folder: dir };
            } catch (err) { return { error: err.message }; }
          });
          ipcMain.handle("store:kvGet", () => ({ ver, data: kho }));
          ipcMain.handle("store:kvSet", (e, key, value) => kvSet(key, value));
          ipcMain.handle("store:version", () => ver);
          ipcMain.handle("store:saveFile", (e, sub, name, data) => saveFile(sub, name, Buffer.from(data)));
          ipcMain.handle("store:listFiles", (e, sub) => listFiles(sub));
          ipcMain.handle("store:readFile", (e, sub, name) => fs.readFileSync(filePath(sub, name)));
          ipcMain.handle("store:reveal", (e, p) => { if (p) shell.showItemInFolder(p); return true; });
          ipcMain.handle("store:lanStatus", () => lanStatus());
          ipcMain.handle("store:lanSet", async (e, cfg) => {
            const port = parseInt(cfg && cfg.port, 10);
            lan = { enabled: !!(cfg && cfg.enabled), port: port >= 1024 && port <= 65535 ? port : 6868, pass: String((cfg && cfg.pass) || "").trim() };
            try { saveLan(); } catch {}
            return applyLan();
          });

          function createWindow() {
            const win = new BrowserWindow({
              width: 1360, height: 860, minWidth: 380, minHeight: 500, title: "Phân tích Cuộc gọi / SMS",
              backgroundColor: "#f3f5f8", autoHideMenuBar: true,
              webPreferences: { preload: path.join(__dirname, "preload.js"), contextIsolation: true, nodeIntegration: false, spellcheck: false }
            });
            win.webContents.setWindowOpenHandler(() => ({ action: "deny" }));
            win.webContents.on("will-navigate", (ev, url) => { if (!url.startsWith("file:")) ev.preventDefault(); });
            win.loadFile(path.join(WEB_DIR, "index.html"));
          }

          app.whenReady().then(async () => {
            Menu.setApplicationMenu(null);
            dataDir = findDataDir();
            if (dataDir) { loadKho(); loadLan(); await applyLan(); }
            createWindow();
          });
          app.on("window-all-closed", () => { stopServer(); app.quit(); });
          EOF_1
          mkdir -p "pc"
          cat > "pc/preload.js" <<'EOF_2'
          const { contextBridge, ipcRenderer } = require("electron");
          contextBridge.exposeInMainWorld("NativeStore", {
            status: () => ipcRenderer.invoke("store:status"),
            choose: () => ipcRenderer.invoke("store:choose"),
            confirm: (folder) => ipcRenderer.invoke("store:confirm", folder),
            kvGet: () => ipcRenderer.invoke("store:kvGet"),
            kvSet: (key, value) => ipcRenderer.invoke("store:kvSet", key, value),
            version: () => ipcRenderer.invoke("store:version"),
            saveFile: (sub, name, data) => ipcRenderer.invoke("store:saveFile", sub, name, data),
            listFiles: (sub) => ipcRenderer.invoke("store:listFiles", sub),
            readFile: (sub, name) => ipcRenderer.invoke("store:readFile", sub, name),
            reveal: (p) => ipcRenderer.invoke("store:reveal", p),
            lanStatus: () => ipcRenderer.invoke("store:lanStatus"),
            lanSet: (cfg) => ipcRenderer.invoke("store:lanSet", cfg)
          });
          EOF_2
          rm -rf pc/web && cp -r web pc/web
          ls -la pc pc/web
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Cài thư viện
        working-directory: pc
        run: npm install --no-audit --no-fund
      - name: Đóng gói PhanTichCuocGoi.exe
        working-directory: pc
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: PhanTichCuocGoi-exe
          path: pc/dist/PhanTichCuocGoi.exe

  android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Kiểm tra thư mục web
        run: |
          for f in web/index.html web/xlsx.full.min.js; do
            if [ ! -f "$f" ]; then echo "::error::Thiếu file $f trên GitHub. Hãy upload lại file này."; missing=1; fi
          done
          [ -z "$missing" ]
      - name: Tạo mã nguồn Android
        run: |
          rm -rf android
          mkdir -p "android"
          cat > "android/settings.gradle" <<'EOF_0'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "PhanTichCuocGoi"
          include ":app"
          EOF_0
          mkdir -p "android"
          cat > "android/build.gradle" <<'EOF_1'
          plugins { id "com.android.application" version "8.5.2" apply false }
          EOF_1
          mkdir -p "android"
          cat > "android/gradle.properties" <<'EOF_2'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF_2
          mkdir -p "android/app"
          cat > "android/app/build.gradle" <<'EOF_3'
          plugins { id "com.android.application" }

          android {
              namespace "vn.phantichcg"
              compileSdk 34
              defaultConfig {
                  applicationId "vn.phantichcg"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0.0"
              }
              sourceSets {
                  // dùng chung giao diện web với bản PC
                  main { assets.srcDirs = ["../../web"] }
              }
              buildTypes {
                  release { minifyEnabled false }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation "androidx.documentfile:documentfile:1.0.1"
          }
          EOF_3
          mkdir -p "android/app/src/main"
          cat > "android/app/src/main/AndroidManifest.xml" <<'EOF_4'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:label="Phân tích CG"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:allowBackup="false"
                  android:usesCleartextTraffic="true"
                  android:theme="@style/AppTheme">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden|screenLayout|smallestScreenSize"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF_4
          mkdir -p "android/app/src/main/java/vn/phantichcg"
          cat > "android/app/src/main/java/vn/phantichcg/MainActivity.java" <<'EOF_5'
          package vn.phantichcg;

          import android.app.Activity;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.UriPermission;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.provider.DocumentsContract;
          import android.util.Base64;
          import android.webkit.JavascriptInterface;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Toast;

          import androidx.documentfile.provider.DocumentFile;

          import org.json.JSONArray;
          import org.json.JSONObject;

          import java.io.ByteArrayOutputStream;
          import java.io.InputStream;
          import java.io.OutputStream;
          import java.nio.charset.StandardCharsets;

          /**
           * Phân tích Cuộc gọi / SMS - bản Android (chạy offline, kết nối được máy chủ LAN).
           * Giao diện là trang web trong assets; dữ liệu lưu vào thư mục người dùng chọn:
           * kho.json (tài khoản), TepDaPhanTich/{mobi,vina,viettel}/ và KetQua/.
           */
          public class MainActivity extends Activity {
              private static final int REQ_FOLDER = 101;
              private static final int REQ_FILE = 102;
              private static final int REQ_SAVEAS = 103;
              private static final String PREFS = "phantichcg";
              private static final String KEY_TREE = "treeUri";
              private static final String KHO_FILE = "kho.json";
              private static final String[] SUBS = {"TepDaPhanTich/mobi", "TepDaPhanTich/vina", "TepDaPhanTich/viettel", "KetQua"};

              private WebView web;
              private ValueCallback<Uri[]> fileCallback;
              private Uri pendingTree;
              private byte[] pendingSave;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  web = new WebView(this);
                  setContentView(web);
                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setAllowFileAccess(true);
                  s.setTextZoom(100);
                  web.setWebViewClient(new WebViewClient());
                  web.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onShowFileChooser(WebView view, ValueCallback<Uri[]> callback, FileChooserParams params) {
                          if (fileCallback != null) fileCallback.onReceiveValue(null);
                          fileCallback = callback;
                          Intent i = new Intent(Intent.ACTION_OPEN_DOCUMENT);
                          i.addCategory(Intent.CATEGORY_OPENABLE);
                          i.setType("*/*");
                          i.putExtra(Intent.EXTRA_MIME_TYPES, new String[]{
                                  "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",
                                  "application/vnd.ms-excel", "text/csv", "text/comma-separated-values",
                                  "text/plain", "application/octet-stream"});
                          try {
                              startActivityForResult(i, REQ_FILE);
                          } catch (Exception e) {
                              fileCallback = null;
                              return false;
                          }
                          return true;
                      }
                  });
                  web.addJavascriptInterface(new Store(), "AndroidStore");
                  web.loadUrl("file:///android_asset/index.html");
              }

              @Override
              public void onBackPressed() {
                  if (web != null && web.canGoBack()) web.goBack();
                  else super.onBackPressed();
              }

              private void js(String code) { runOnUiThread(() -> web.evaluateJavascript(code, null)); }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);
                  if (requestCode == REQ_FILE) {
                      Uri[] res = null;
                      if (resultCode == RESULT_OK && data != null && data.getData() != null) res = new Uri[]{data.getData()};
                      if (fileCallback != null) fileCallback.onReceiveValue(res);
                      fileCallback = null;
                      return;
                  }
                  if (requestCode == REQ_SAVEAS) {
                      String msg = "";
                      if (resultCode == RESULT_OK && data != null && data.getData() != null && pendingSave != null) {
                          try (OutputStream os = getContentResolver().openOutputStream(data.getData(), "wt")) {
                              os.write(pendingSave);
                              DocumentFile f = DocumentFile.fromSingleUri(this, data.getData());
                              msg = f != null && f.getName() != null ? f.getName() : "đã lưu";
                          } catch (Exception e) {
                              Toast.makeText(this, "Không lưu được file: " + e.getMessage(), Toast.LENGTH_LONG).show();
                          }
                      }
                      pendingSave = null;
                      js("window.__nativeSaved && window.__nativeSaved(" + JSONObject.quote(msg) + ")");
                      return;
                  }
                  if (requestCode == REQ_FOLDER) {
                      String json = "";
                      if (resultCode == RESULT_OK && data != null && data.getData() != null) {
                          Uri tree = data.getData();
                          try {
                              getContentResolver().takePersistableUriPermission(tree,
                                      Intent.FLAG_GRANT_READ_URI_PERMISSION | Intent.FLAG_GRANT_WRITE_URI_PERMISSION);
                              pendingTree = tree;
                              DocumentFile dir = DocumentFile.fromTreeUri(this, tree);
                              JSONObject o = new JSONObject();
                              o.put("folder", describe(tree));
                              o.put("hasData", dir != null && dir.findFile(KHO_FILE) != null);
                              json = o.toString();
                          } catch (Exception e) {
                              Toast.makeText(this, "Không cấp được quyền cho thư mục này", Toast.LENGTH_LONG).show();
                          }
                      }
                      js("window.__nativeChosen && window.__nativeChosen(" + JSONObject.quote(json) + ")");
                  }
              }

              /* ---------- tiện ích lưu trữ ---------- */

              private Uri savedTree() {
                  String u = getSharedPreferences(PREFS, MODE_PRIVATE).getString(KEY_TREE, null);
                  if (u == null) return null;
                  Uri tree = Uri.parse(u);
                  for (UriPermission p : getContentResolver().getPersistedUriPermissions()) {
                      if (p.getUri().equals(tree) && p.isWritePermission()) return tree;
                  }
                  return null;
              }

              private DocumentFile root() {
                  Uri t = savedTree();
                  return t == null ? null : DocumentFile.fromTreeUri(this, t);
              }

              private String describe(Uri tree) {
                  try {
                      String id = DocumentsContract.getTreeDocumentId(tree);
                      int c = id.indexOf(':');
                      String vol = c > 0 ? id.substring(0, c) : "";
                      String p = c >= 0 ? id.substring(c + 1) : id;
                      return ("primary".equalsIgnoreCase(vol) ? "Bộ nhớ máy" : "Thẻ nhớ " + vol) + "/" + p;
                  } catch (Exception e) {
                      return tree.toString();
                  }
              }

              private static boolean okSub(String sub) {
                  for (String s : SUBS) if (s.equals(sub)) return true;
                  return false;
              }

              /** Lấy (hoặc tạo) thư mục con theo đường dẫn "A/B". */
              private DocumentFile subDir(DocumentFile parent, String path, boolean create) {
                  DocumentFile d = parent;
                  for (String part : path.split("/")) {
                      if (part.isEmpty()) continue;
                      DocumentFile n = d.findFile(part);
                      if (n == null || !n.isDirectory()) {
                          if (!create) return null;
                          n = d.createDirectory(part);
                          if (n == null) return null;
                      }
                      d = n;
                  }
                  return d;
              }

              private static String mimeOf(String name) {
                  String n = name.toLowerCase();
                  if (n.endsWith(".xlsx")) return "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet";
                  if (n.endsWith(".xls")) return "application/vnd.ms-excel";
                  if (n.endsWith(".csv")) return "text/csv";
                  if (n.endsWith(".json")) return "application/json";
                  return "application/octet-stream";
              }

              private void writeBytes(DocumentFile dir, String name, byte[] bytes) throws Exception {
                  DocumentFile f = dir.findFile(name);
                  if (f == null) {
                      f = dir.createFile(mimeOf(name), name);
                      if (f == null) throw new Exception("không tạo được file " + name);
                      // một số trình quản lý file tự thêm đuôi theo kiểu file, nên đổi lại đúng tên
                      if (!name.equals(f.getName())) f.renameTo(name);
                  }
                  try (OutputStream os = getContentResolver().openOutputStream(f.getUri(), "wt")) {
                      if (os == null) throw new Exception("không ghi được file " + name);
                      os.write(bytes);
                      os.flush();
                  }
              }

              private byte[] readBytes(DocumentFile f) throws Exception {
                  try (InputStream is = getContentResolver().openInputStream(f.getUri())) {
                      if (is == null) return new byte[0];
                      ByteArrayOutputStream bo = new ByteArrayOutputStream();
                      byte[] buf = new byte[65536];
                      int n;
                      while ((n = is.read(buf)) > 0) bo.write(buf, 0, n);
                      return bo.toByteArray();
                  }
              }

              /* ---------- cầu nối với giao diện ---------- */

              private class Store {
                  @JavascriptInterface
                  public String status() {
                      try {
                          JSONObject o = new JSONObject();
                          Uri t = savedTree();
                          o.put("platform", "android");
                          o.put("configured", t != null);
                          o.put("folder", t == null ? "" : describe(t));
                          return o.toString();
                      } catch (Exception e) {
                          return "{\"platform\":\"android\",\"configured\":false}";
                      }
                  }

                  @JavascriptInterface
                  public void choose() {
                      runOnUiThread(() -> {
                          Intent i = new Intent(Intent.ACTION_OPEN_DOCUMENT_TREE);
                          i.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION | Intent.FLAG_GRANT_WRITE_URI_PERMISSION
                                  | Intent.FLAG_GRANT_PERSISTABLE_URI_PERMISSION | Intent.FLAG_GRANT_PREFIX_URI_PERMISSION);
                          if (Build.VERSION.SDK_INT >= 26) {
                              try {
                                  Uri docs = DocumentsContract.buildDocumentUri("com.android.externalstorage.documents", "primary:Documents");
                                  i.putExtra(DocumentsContract.EXTRA_INITIAL_URI, docs);
                              } catch (Exception ignored) { }
                          }
                          try {
                              startActivityForResult(i, REQ_FOLDER);
                          } catch (Exception e) {
                              web.evaluateJavascript("window.__nativeChosen && window.__nativeChosen('')", null);
                          }
                      });
                  }

                  @JavascriptInterface
                  public String confirm() {
                      try {
                          if (pendingTree == null) return "{\"error\":\"Chưa chọn thư mục\"}";
                          SharedPreferences.Editor ed = getSharedPreferences(PREFS, MODE_PRIVATE).edit();
                          ed.putString(KEY_TREE, pendingTree.toString()).apply();
                          DocumentFile r = DocumentFile.fromTreeUri(MainActivity.this, pendingTree);
                          if (r == null || !r.canWrite()) return "{\"error\":\"Không ghi được vào thư mục này\"}";
                          for (String s : SUBS) subDir(r, s, true);
                          if (r.findFile(KHO_FILE) == null) writeBytes(r, KHO_FILE, "{}".getBytes(StandardCharsets.UTF_8));
                          JSONObject o = new JSONObject();
                          o.put("folder", describe(pendingTree));
                          return o.toString();
                      } catch (Exception e) {
                          return "{\"error\":" + JSONObject.quote(String.valueOf(e.getMessage())) + "}";
                      }
                  }

                  @JavascriptInterface
                  public String kvRead() {
                      try {
                          DocumentFile r = root();
                          if (r == null) return "{}";
                          DocumentFile f = r.findFile(KHO_FILE);
                          if (f == null) f = r.findFile(KHO_FILE + ".bak");
                          return f == null ? "{}" : new String(readBytes(f), StandardCharsets.UTF_8);
                      } catch (Exception e) {
                          return "{}";
                      }
                  }

                  @JavascriptInterface
                  public synchronized String kvWrite(String json) {
                      try {
                          DocumentFile r = root();
                          if (r == null) return "Chưa chọn thư mục dữ liệu";
                          DocumentFile old = r.findFile(KHO_FILE);
                          if (old != null) {
                              try { writeBytes(r, KHO_FILE + ".bak", readBytes(old)); } catch (Exception ignored) { }
                          }
                          writeBytes(r, KHO_FILE, json.getBytes(StandardCharsets.UTF_8));
                          return "ok";
                      } catch (Exception e) {
                          return String.valueOf(e.getMessage());
                      }
                  }

                  @JavascriptInterface
                  public String saveFile(String sub, String name, String b64) {
                      try {
                          if (!okSub(sub)) return "ERR: thư mục không hợp lệ";
                          DocumentFile r = root();
                          if (r == null) return "ERR: Chưa chọn thư mục dữ liệu";
                          String safe = name.replaceAll("[\\\\/:*?\"<>|]", "_");
                          DocumentFile d = subDir(r, sub, true);
                          if (d == null) return "ERR: không tạo được thư mục " + sub;
                          writeBytes(d, safe, Base64.decode(b64, Base64.DEFAULT));
                          return describe(savedTree()) + "/" + sub + "/" + safe;
                      } catch (Exception e) {
                          return "ERR: " + e.getMessage();
                      }
                  }

                  @JavascriptInterface
                  public String listFiles(String sub) {
                      JSONArray a = new JSONArray();
                      try {
                          DocumentFile r = root();
                          if (r == null || !okSub(sub)) return "[]";
                          DocumentFile d = subDir(r, sub, false);
                          if (d == null) return "[]";
                          for (DocumentFile f : d.listFiles()) {
                              if (!f.isFile() || f.getName() == null || f.getName().startsWith(".")) continue;
                              JSONObject o = new JSONObject();
                              o.put("name", f.getName());
                              o.put("size", f.length());
                              o.put("time", f.lastModified());
                              a.put(o);
                          }
                      } catch (Exception ignored) { }
                      return a.toString();
                  }

                  @JavascriptInterface
                  public String readFile(String sub, String name) {
                      try {
                          DocumentFile r = root();
                          if (r == null || !okSub(sub)) return "ERR: Chưa chọn thư mục dữ liệu";
                          DocumentFile d = subDir(r, sub, false);
                          DocumentFile f = d == null ? null : d.findFile(name);
                          if (f == null) return "ERR: Không tìm thấy file " + name;
                          return Base64.encodeToString(readBytes(f), Base64.NO_WRAP);
                      } catch (Exception e) {
                          return "ERR: " + e.getMessage();
                      }
                  }

                  @JavascriptInterface
                  public void saveAs(String name, String b64) {
                      pendingSave = Base64.decode(b64, Base64.DEFAULT);
                      runOnUiThread(() -> {
                          Intent i = new Intent(Intent.ACTION_CREATE_DOCUMENT);
                          i.addCategory(Intent.CATEGORY_OPENABLE);
                          i.setType(mimeOf(name));
                          i.putExtra(Intent.EXTRA_TITLE, name);
                          try {
                              startActivityForResult(i, REQ_SAVEAS);
                          } catch (Exception e) {
                              pendingSave = null;
                              web.evaluateJavascript("window.__nativeSaved && window.__nativeSaved('')", null);
                          }
                      });
                  }
              }
          }
